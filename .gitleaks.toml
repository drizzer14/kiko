[extend]
useDefault = true

[allowlist]
description = "Ignore vendored and generated paths"
paths = [
  '''ios/Pods/.*''',
  '''vendor/.*''',
  '''node_modules/.*''',
  # CocoaPods lockfile: SHA1 checksums of each pod spec/source, not
  # secrets. Confirmed false positive against generic-api-key
  # (fingerprint ios/Podfile.lock:generic-api-key:1966).
  '''ios/Podfile\.lock''',
]
# NOTE: a review-diff artifact under .superpowers/ can also quote an
# ios/Podfile.lock hunk verbatim (same false-positive class as the path
# entry above). That is intentionally NOT handled here by widening
# `paths` or adding a content `regexes` entry — both were tried and
# reverted; see .gitleaksignore and CLAUDE.md's "Documented exceptions"
# for why, and for the single, fingerprint-scoped exception this repo
# actually uses instead.
