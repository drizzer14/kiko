[extend]
useDefault = true

[allowlist]
description = "Ignore vendored and generated paths"
paths = [
  '''ios/Pods/.*''',
  '''vendor/.*''',
  '''node_modules/.*''',
  # CocoaPods lockfile: SHA1 checksums of each pod spec/source, not
  # secrets. Confirmed false positive against generic-api-key
  # (fingerprint ios/Podfile.lock:generic-api-key:1966).
  '''ios/Podfile\.lock''',
  '''\.superpowers/.*''',
  # Generated, gitignored Release build output. Its minified
  # main.jsbundle contains minified identifiers (e.g. obj2Keys.length,
  # _usePropsWithDefaults2) that trip generic-api-key. Never committed.
  '''ios/build/.*''',
]
# See CLAUDE.md "Documented exceptions" for why .superpowers/ is allowlisted.
