# Device confirm for task 10/10 D1 (docs/harness/documented-exceptions.md, "patch-package
# patches"): a field focused in one pane must not move the OTHER pane's scroll offset. NOT a
# screenshot check — no `takeScreenshot` step; it asserts a row stays on screen.
#
# PRECONDITION (the coordinator/user sets it; the flow does not): the iPhone Duo simulator
# E862974E is UNFOLDED, so the app shows two panes (Settings list left, detail right). The
# flow only reaches the Import Data screen in the right pane; in a single pane there is no
# "other pane" and the assertion proves nothing.
#
# NOT DESTRUCTIVE: no `clearState`, no `clearKeychain`, and `launchApp` keeps the app's data —
# the user's demo data is on that simulator. Nothing is typed into the key field, and nothing
# is imported.
#
# EXPECTED: RED on a build without patches/react-native+0.87.1.patch (sim build ba5e9027),
# GREEN on a patched build. On an unpatched build the left pane's scroll view reacts to the
# keyboard of a field in the RIGHT pane: its content offset moves down by one keyboard height
# per show and a hide does not restore it, so after three shows the top "System" row has
# scrolled off and the final assertion fails. One show moves only about one keyboard height,
# hence the repeats.
#
# Run (host note, ops skill "Maestro on this host"):
#   JAVA_HOME=/opt/homebrew/opt/openjdk@21 maestro --device E862974E test \
#     .maestro/duo-keyboard-other-pane.yaml
#
# Authored WITHOUT a live Maestro run (battery, no simulator use): the first execution must
# confirm the step sequence, in particular that tapping the secure field by its placeholder
# focuses it and that the native "Done" accessory is hit by `tapOn: "Done"`.
appId: com.dmytro-vasylkivskyi.kiko
---
- launchApp

- extendedWaitUntil:
    notVisible:
      id: "migrations-gate-pending"
    timeout: 30000

# Settings tab (testID "gear" is the tab's, as in onboarding-fresh-install.yaml).
- tapOn:
    id: "gear"

# The first Settings row, at the very top of the left pane
# (settings.screen.tsx `settings-row-system`, label `settings.system` = "System").
- assertVisible:
    id: "settings-row-system"

# "Import Data" row (`settings-row-import-data`) opens the screen in the RIGHT pane.
- tapOn:
    id: "settings-row-import-data"
- assertVisible: "Choose file"

# Two-pane guard: in a single pane Import Data is pushed OVER the Settings list, so the row is
# hidden. Seeing it next to the open Import Data screen proves the unfolded two-pane layout; a
# failure here means "precondition: not unfolded", not D1.
- assertVisible:
    id: "settings-row-system"

# Focus the "Encryption key" field (its placeholder `settings.dataImport.keyPlaceholder`;
# the label "Encryption key" is a separate Text), then dismiss with the keyboard's Done
# accessory (`common.done`). Three rounds, so an unpatched build's shift adds up.
- repeat:
    times: 3
    commands:
      - tapOn: "Paste the key from your export"
      - tapOn: "Done"

# The left pane must not have moved: the top row is still on screen.
- assertVisible:
    id: "settings-row-system"
