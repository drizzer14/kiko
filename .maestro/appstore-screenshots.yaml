# App Store screenshot capture flow (6.9-inch / iPhone 17 Pro Max, Ukrainian).
#
# PREREQUISITE (ops): a screenshot-mode build (`ENVFILE=.env.screenshots`,
# which inlines SCREENSHOT_MODE=true + SCREENSHOT_LANG=uk) is already
# installed on a BOOTED, PINNED simulator — "iPhone 17 Pro Max" (6.9-inch,
# 1320x2868 portrait, the only orientation the app supports). Set the
# simulator's clock to 2026-09-10 first (`xcrun simctl status_bar ... `, or a
# real date-set) so every "last 30 days" chart on Statistics is full — the
# seed's 63 transactions span roughly six months ending at the device clock.
# `MigrationsGate` re-seeds the deterministic Ukrainian demo dataset at every
# boot (idempotent) and forces reduced motion; the app then shows real seeded
# content with the lock OFF, so this flow never needs to authenticate.
#
# Every `takeScreenshot` step below uses a BARE relative name (e.g.
# `01-home-networth`, no directory, no extension) — never an absolute or
# OUTPUT_DIR-prefixed path. Maestro 2.10.0's `takeScreenshot` REFUSES any path
# that resolves outside this run's own `takeScreenshot` artifact folder
# (verified by decompiling the installed maestro-orchestra.jar with javap; an
# earlier `${OUTPUT_DIR}/<name>` design failed at runtime with "Invalid path
# ... it resolves outside this run's takeScreenshot output folder"), so an
# absolute destination cannot be passed inline in the flow at all. Maestro
# appends `.png` to the bare name itself and writes it under a
# `takeScreenshot/` subfolder inside whatever `--debug-output <dir>` resolves
# to for this run — the caller (scripts/checks/screenshot-diff/run-flow-and-
# collect.sh, shared by both scripts/checks/screenshots.sh and
# scripts/screenshots-capture.sh) runs `maestro test --debug-output <temp
# dir> .maestro/appstore-screenshots.yaml` and then SEARCHES that temp dir's
# tree for `takeScreenshot/<name>.png` by basename (the exact nested path
# includes an unpredictable session-timestamp + flow-name segment, so it is
# located by search, not assumed).
#
# Run command (ops), to capture the deliverable/baseline set:
#   npm run screenshots:capture
# (equivalently: bash scripts/screenshots-capture.sh)
#
# Run command (ops/CI), to regression-check against the committed baseline:
#   npm run check:screenshots
appId: com.dmytro-vasylkivskyi.kiko
---
# Fresh launch (do not clearState: the seed is idempotent and re-running it
# against an already-seeded DB is the steady-state case anyway; clearing state
# would also drop the persisted language/lock settings the seed relies on).
- launchApp

# MigrationsGate shows this testID while `initDatabase -> runMigrations ->
# settingsRepo.ensure -> ... -> seedScreenshotDataIfEnabled` runs. A generous
# timeout: the seed writes 5 accounts / 5 holdings / 63 transactions on a cold
# boot, which is slower than a normal launch.
#
# `timeout` is NOT a property of `assertNotVisible` (Maestro 2.10.0 parse
# error: "Unknown Property: timeout") — `assertVisible`/`assertNotVisible`'s
# selector map (YamlElementSelector) has no `timeout` field at all. Waiting
# for an element to disappear with an explicit timeout is `extendedWaitUntil`
# (YamlExtendedWaitUntil), which DOES declare `timeout` alongside `visible`/
# `notVisible`, verified against the installed maestro-orchestra.jar's actual
# YamlExtendedWaitUntil field list.
- extendedWaitUntil:
    notVisible:
      id: "migrations-gate-pending"
    timeout: 30000

# ---------------------------------------------------------------------------
# 1-2. Home tab (the app boots onto HomeTab by default)
# ---------------------------------------------------------------------------
- assertVisible:
    id: "home-content"
- takeScreenshot: 01-home-networth

- assertVisible:
    id: "home-transactions"
- scroll
- assertVisible:
    id: "home-transactions"
- takeScreenshot: 02-home-transactions-scrolled

# ---------------------------------------------------------------------------
# 3-5. Accounts tab -> Account detail -> Holding detail (ledger)
# ---------------------------------------------------------------------------
# Native bottom tab bar (@bottom-tabs/react-navigation / react-native-bottom-tabs,
# bounds [0,873][440,956]) — tapped by its SF Symbol icon resource-id
# (`{ sfSymbol: ... }` in src/navigation/root.navigator.tsx's tabBarIcon),
# NEVER by localized tab text. Verified from an on-device hierarchy dump: the
# Accounts tab is ICON-ONLY (no text label at all — unlike Home/Statistics/
# Settings, which do show their Ukrainian title alongside the icon), so
# `tapOn: "Рахунки"` matched the account-filter-menu's "Рахунки" label in the
# MIDDLE of the Home screen instead of the tab and never navigated anywhere
# (a real, observed failure — every other tab's localized text is ALSO
# ambiguous for the same reason: on-screen content can repeat a tab's title).
# Icon ids, confirmed from the dump: Home = house.fill, Accounts =
# wallet.pass.fill, Statistics = chart.xyaxis.line, Settings = gearshape.fill.
- tapOn:
    id: "wallet.pass.fill"
- assertVisible:
    id: "accounts-grid"
- takeScreenshot: 03-accounts-grid

# One account-card per seeded account; tapOn matches the first on-screen match.
- tapOn:
    id: "account-card"
- assertVisible:
    id: "account-detail-content"
- takeScreenshot: 04-account-detail

# Each account has exactly one seeded holding, so the first holding-grid-item
# is deterministic. scrollUntilVisible is defensive in case the account header
# (sync status / actions row) pushes it below the fold on a smaller viewport.
- scrollUntilVisible:
    element:
      id: "holding-grid-item"
    direction: DOWN
- tapOn:
    id: "holding-grid-item"
- assertVisible:
    id: "holding-value-header"
- assertVisible:
    id: "ledger-list"
- takeScreenshot: 05-holding-detail-ledger

# ---------------------------------------------------------------------------
# 6-10. Statistics tab — one screenshot per chart block, in on-screen order
# ---------------------------------------------------------------------------
# Jump DIRECTLY to Statistics by its tab icon — do NOT `back` out of the
# Accounts stack first. @bottom-tabs/react-navigation switches to the tapped
# tab from ANY stack depth (we are currently 2 screens deep: HoldingDetail ->
# AccountDetail -> Accounts), so unwinding the stack first is unnecessary and
# was itself the failure: `back` from HoldingDetail landed somewhere that
# never satisfied `assertVisible: accounts-grid` (a real, observed failure).
# Every section change in this flow uses this same direct tab-icon-tap +
# target-screen-assertVisible shape — see the comment above the Accounts tap
# for why the icon id, not localized text, is the selector.
- tapOn:
    id: "chart.xyaxis.line"
- assertVisible:
    id: "statistics-blocks"

# waitForAnimationToEnd settles each chart before its screenshot: reduced
# motion (forced by the screenshot-mode build) does not fully suppress every
# entrance/line-draw animation, so a screenshot taken immediately after the
# chart becomes visible can land mid-animation. Observed for real: shot 10
# (spending-trend) failed the pixel-diff regression check at a 9.7% mismatch
# between two otherwise-identical consecutive captures — far above the 0.5%
# tolerance — which is the signature of a still-animating frame, not a real
# visual change. `timeout: 5000` bounds the wait; it returns as soon as the
# animation settles, so this is not a fixed 5s delay per shot. Verified as a
# real Maestro 2.10.0 command by decompiling the installed maestro-
# orchestra.jar (YamlWaitForAnimationToEndCommand: timeout/label/optional
# fields, all optional). Applied to every Statistics chart shot (06-10) —
# the ones that actually animate; the other shots (Home/Accounts/Settings)
# did not exhibit this failure.
- assertVisible:
    id: "statistics-block-line"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-statistics-net-worth-line

- scrollUntilVisible:
    element:
      id: "statistics-block-bar"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-statistics-by-type-bar

- scrollUntilVisible:
    element:
      id: "statistics-block-pie"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08-statistics-account-contribution-pie

# Scroll to the EXACT element being screenshotted, not to the block's header
# (statistics-block-category, statistics.screen.tsx:786). The category block
# is taller than the others (header + a filter row + the chart), so stopping
# the scroll as soon as the header becomes visible left the chart itself
# still off-screen below the fold (a real, observed failure).
#
# `category-pie` (the testID passed to <PieChart testID="category-pie" ...>
# at statistics.screen.tsx:805) is NOT itself a rendered element's id — the
# design-system PieChart component uses its `testID` prop only as a PREFIX
# for its actual sub-elements (`${testID}-center-total`, `${testID}-arc-*`,
# `${testID}-legend-*`, `${testID}-swatch-*`; see pie-chart.component.tsx /
# pie-chart.component.test.tsx), so `scrollUntilVisible: { id: "category-pie" }`
# could never match anything (confirmed against a real on-device hierarchy
# dump: no element has that exact id). `category-pie-center-total` is the
# donut's center total label — scrolling IT fully into view guarantees the
# whole donut is on screen for the shot.
# visibilityPercentage: 100 requires the target to be FULLY on screen (not
# just minimally visible) before this scroll stops, so the screenshot cannot
# land mid-scroll; a generous timeout covers the extra scroll distance this
# block needs versus the others.
- scrollUntilVisible:
    element:
      id: "category-pie-center-total"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 09-statistics-expenses-by-category

- scrollUntilVisible:
    element:
      id: "statistics-block-trend"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 10-statistics-spending-trend

# ---------------------------------------------------------------------------
# 11-12. Settings -> System sub-page
# ---------------------------------------------------------------------------
# Tab bar icon id, not text — see the comment above the Accounts tap.
- tapOn:
    id: "gearshape.fill"
- assertVisible:
    id: "settings-card-system"
- takeScreenshot: 11-settings-main

- tapOn:
    id: "settings-row-system"
- assertVisible:
    id: "settings-card-language"
- takeScreenshot: 12-settings-system
