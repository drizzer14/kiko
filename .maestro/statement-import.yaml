# Functional flow for the in-app document-picker statement-import entry
# point (Phase 1b, entry point 1 — see docs/plans/statement-import.md section
# B/B.1). NOT a screenshot-diff check — no `takeScreenshot` step, no baseline,
# not wired into `check:screenshots`. This asserts real end-to-end BEHAVIOR:
# picking the committed uabean Monobank CSV fixture, seeing its preview,
# choosing a holding, importing, and seeing the success count.
#
# LOCALE: `.maestro/regression.yaml`'s own seeded content is Ukrainian
# ("Монобанк", "Додати актив", …), so this flow asserts the UKRAINIAN catalog
# strings too (`src/i18n/locales/uk.ts`'s `accountDetail.importStatement` /
# `statementImport.*`) to match whatever locale that same screenshot-mode
# build runs. The parsed format's OWN `displayName` ("Monobank (CSV)",
# `monobank-csv.format.ts`) is data, not a catalog string, so it stays English
# regardless of locale.
#
# PREREQUISITE (ops): the committed fixture
# (src/statement-import/formats/monobank-csv/__fixtures__/uabean-monobank-sample.csv)
# must be reachable from the iOS Files app on the target simulator/device
# BEFORE this flow runs — e.g. pushed into the simulator's "On My iPhone"
# location (`xcrun simctl` file operations, or AirDrop/Files-app import on a
# real device) under a stable name. This is a real, low-PII, MIT-licensed
# sample (see NOTICE.md) — sharing it via the picker in a headless run carries
# none of the live-credential constraints that block the bank-connect flows
# from being exercised this way.
#
# This flow was authored WITHOUT a live Maestro run (no booted simulator with
# the fixture provisioned was available at authoring time) — ops/qa must
# verify the exact step sequence on a real simulator the first time this flow
# executes, the same caveat `.maestro/regression.yaml`'s own header carries
# for its own untested flow. Two spots in particular need live confirmation:
# the native Files-picker navigation (step 2 — no app testID reaches it), and
# the `index: 1` disambiguation below (the seeded Монобанк account AND its
# one seeded holding share the exact same name, so the holding row inside the
# target-holding sheet is presumed to be the SECOND "Монобанк" match on
# screen — verify this ordinal against the real sheet).
appId: com.dmytro-vasylkivskyi.kiko
---
- launchApp

- extendedWaitUntil:
    notVisible:
      id: "migrations-gate-pending"
    timeout: 30000

# ---------------------------------------------------------------------------
# 1. Accounts tab -> an account's detail screen
# ---------------------------------------------------------------------------
- tapOn:
    id: "wallet.pass.fill"
- assertVisible:
    id: "accounts-grid"
- tapOn:
    id: "account-card"
- assertVisible:
    id: "account-detail-content"

# ---------------------------------------------------------------------------
# 2. Open the document picker from the footer's "Import statement" action
# ---------------------------------------------------------------------------
- tapOn:
    text: "Імпортувати виписку"

# The native iOS document picker (UIDocumentPickerViewController) — not an
# app screen, so there is no app testID to assert on here. "Recents" is the
# picker's default browse tab (native iOS chrome, not a Kiko catalog string,
# so it stays in the device's own language — English on a US-locale
# simulator).
- assertVisible:
    text: "Recents"
- tapOn:
    text: "uabean-monobank-sample"

# ---------------------------------------------------------------------------
# 3. StatementImportScreen: preview, choose a holding, import
# ---------------------------------------------------------------------------
- assertVisible:
    text: "Monobank (CSV)"
- assertVisible:
    id: "statement-import-transaction-count"
# The fixture (C.4, NOTICE.md) carries exactly 4 rows.
- assertVisible:
    text: "4"

- tapOn:
    text: "Оберіть актив"
- tapOn:
    text: "Монобанк"
    index: 1

- tapOn:
    text: "Імпортувати"
- assertVisible:
    text: "Імпортовано 4 з 4"
