rules:
  # ---- Class A: deterministic hard-fail (severity ERROR) ----
  - id: kiko-disabled-tls
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      TLS certificate validation is disabled. An attacker on the network can
      read or modify the app's traffic. Enable validation. Do not ship this.
    patterns:
      - pattern-either:
          - pattern: "rejectUnauthorized: false"
  - id: kiko-insecure-random-for-secrets
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      Math.random is not cryptographically secure. Do not use it for tokens,
      keys, or secrets. Use a CSPRNG (react-native-get-random-values / crypto).
    patterns:
      - pattern-regex: (token|secret|key|nonce|otp)\s*=\s*.*Math\.random
  - id: kiko-secret-in-asyncstorage
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      Secrets must not be written to AsyncStorage; it is unencrypted. Use the
      iOS Keychain (react-native-keychain) for tokens and credentials.
    patterns:
      - pattern-either:
          - pattern: AsyncStorage.setItem($K, $TOKEN)
      - metavariable-regex:
          metavariable: $K
          regex: (?i).*(token|secret|password|credential).*
  - id: kiko-secret-in-db-or-log
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      A token/secret/credential must never be written to the database or a log.
      The Monobank token lives only in the iOS Keychain (react-native-keychain).
    patterns:
      - pattern-either:
          - pattern: console.$M($TOKEN)
          - pattern: $DB.insert($TBL).values($TOKEN)
      - metavariable-regex:
          metavariable: $TOKEN
          regex: (?i).*(token|secret|password|credential).*
  # Guideline 5.6 (App Store rejection of build 7: "features intentionally
  # hidden during review"). Three shapes, one rule: importing a
  # SHOW_*/HIDE_*/SCREENSHOT_* visibility-control @env flag (any flag named
  # that way IS a visibility-control switch by the project's own naming
  # convention — see CLAUDE.md/documented-exceptions.md), a static `import`
  # reaching from app source into the dev-only `e2e/` tree, and a dynamic
  # `require(...)` reaching the same `e2e/` tree. All three are
  # deterministic, always-a-bug shapes, so ERROR: a 5.6 violation blocks a
  # release outright, there is no legitimate reason to ship any of them.
  #
  # The dynamic `require` arm exists because Metro's dead-code elimination
  # was empirically proven UNTRUSTWORTHY: build 8 shipped `seedScreenshotData`
  # in the `main.jsbundle` despite it sitting behind a dead
  # `SCREENSHOT_MODE === 'true'` branch in `migrations.gate.tsx` — the exact
  # `require(...)` this rule used to exempt on the theory that DCE would
  # delete it. That branch (and the flag) is deleted outright now (this
  # track), so there is no longer any exempted crossing of any kind: a
  # `require` reaching `e2e/` is a finding, exactly like a static import.
  #
  # No `paths.include` scope here on purpose, unlike most file-scoped rules.
  # A path-prefixed include (e.g. "src/**") hits a known Semgrep 1.175 gotcha
  # (see `kiko-linter`'s "Semgrep facts verified on 1.175"): Semgrep matches
  # it against the path relative to the SCAN ROOT, so it silently matches
  # NOTHING the moment `scripts/checks/semgrep-rules.sh` scans
  # `rules/fixtures/` directly (the fixture is not nested under a `src/`
  # segment) — a rule that stops firing on its own fixture is the exact
  # failure this whole harness exists to prevent. Scoping is achieved with
  # content specificity instead: the
  # `e2e/` regexes only match a specifier that literally spells out an
  # `e2e/` path segment, which a file INSIDE `e2e/` never needs to do for
  # its own relative imports (verified empirically —
  # `e2e/screenshot/seed/screenshot-seed.test.ts` imports
  # `'./screenshot-seed'`, not `'.../e2e/screenshot/...'`); the
  # SHOW_/HIDE_/SCREENSHOT_ regex keys on the imported flag's own name, which
  # is unambiguous wherever it appears. Verified zero findings on the real
  # tree today (`src/` and `e2e/` both).
  - id: kiko-no-hidden-feature-flag-or-demo-import
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      Guideline 5.6 hidden-feature pattern: this either imports a
      SHOW_*/HIDE_*/SCREENSHOT_* visibility-control @env flag to gate what UI
      renders, statically imports a dev-only module from `e2e/`
      (screenshot/demo/seed data) into app source, or dynamically
      `require()`s the same `e2e/` tree. None of these can be trusted to
      strip from the shipping bundle — build 8 shipped `seedScreenshotData`
      in the `main.jsbundle` despite it sitting behind a dead
      `SCREENSHOT_MODE === 'true'` branch, so Metro's constant-folding is
      NOT a defense a dynamic `require` can rely on either. Remove the
      flag/import/require outright, or ship the feature fully and
      unconditionally; never behind a visibility switch.
    patterns:
      - pattern-either:
          - pattern-regex: import\s*\{[^}]*\b(SHOW_[A-Z0-9_]*|HIDE_[A-Z0-9_]*|SCREENSHOT_[A-Z0-9_]*)\b[^}]*\}\s*from\s*['"]@env['"]
          - pattern-regex: import\s[^;]*from\s*['"][^'"]*\be2e/[^'"]*['"]
          - pattern-regex: require\s*\(\s*['"][^'"]*\be2e/[^'"]*['"]\s*\)
  # Layer rule (skill-gap-analysis #14): `src/screens/**` is the UI layer that
  # composes design-system primitives and domain modules, never the other way
  # around. A design-system component importing a screens module (FieldTrigger
  # used to live under `src/screens/forms/` and was imported by
  # `currency-field.component.tsx`, until it was moved) is a real layer
  # inversion: it makes a shared primitive depend on app-specific UI, and one
  # screen's internal refactor can now break an unrelated design-system
  # consumer. `src/screens/**` and `src/navigation/**` are exempted since they
  # ARE the UI layer (navigation wires screens together by design), and so is
  # the app root `App.tsx`.
  #
  # `paths.exclude` (unlike `paths.include`, see `kiko-linter`'s "Semgrep
  # facts verified on 1.175") is safe to path-prefix here: it was verified
  # empirically against a
  # throwaway rule+tree that a path-prefixed `paths.exclude` entry matches
  # correctly whether Semgrep's target is a whole directory, an absolute
  # directory path, or a single absolute file path (`fast.sh` scans one file
  # at a time) — an exclude that fails to match only means "don't exclude",
  # which fails safe (the rule still applies), the opposite failure mode from
  # a prefixed `paths.include` failing to match (which fails closed and
  # silently stops the rule from ever firing). The fixture pair below lives
  # directly in `rules/fixtures/`, not nested under `src/screens/` or
  # `src/navigation/`, so neither exclude pattern touches it — the fixture
  # scan is proven purely by the content regex below, same as the `e2e/` rule
  # above.
  #
  # No test-file carve-out: no test outside `src/screens/`/`src/navigation/`
  # imports from `screens/` today (verified empirically), and a test that
  # reached into a screen for a shared helper would be the same layer
  # inversion as production code reaching in — so this is not exempted.
  - id: kiko-no-import-screens-outside-ui
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      A non-screens, non-navigation module imports from `src/screens/**`.
      `src/screens/` is the UI layer that composes shared design-system and
      domain modules — nothing outside `src/screens/**`, `src/navigation/**`,
      or `App.tsx` may import from it. Move the shared code being imported
      into `src/design-system/` or the owning domain module instead (see the
      `kiko-design-system` skill's `FieldTrigger` entry for a worked
      precedent), then import it from there.
    paths:
      exclude:
        - "src/screens/**"
        - "src/navigation/**"
        - "App.tsx"
    patterns:
      - pattern-either:
          - pattern-regex: import\s[^;]*from\s*['"](?:[^'"]*/)?screens/[^'"]*['"]
          - pattern-regex: require\s*\(\s*['"](?:[^'"]*/)?screens/[^'"]*['"]\s*\)
  # ---- Class A: code-style conventions (deterministic hard-fail) ----
  - id: kiko-repo-no-class
    languages: [typescript]
    severity: ERROR
    message: >
      Repositories are plain function modules, never classes. Export an object
      literal of query/write functions applied with `satisfies Repository`.
    paths:
      include:
        - "*.repo.ts"
    patterns:
      - pattern-regex: \bclass\s+\w
  - id: kiko-repo-satisfies-not-annotation
    languages: [typescript]
    severity: ERROR
    message: >
      A repository object uses `satisfies Repository`, never a `: Repository`
      type annotation, so its precise per-method signatures are not widened away.
    paths:
      include:
        - "*.repo.ts"
    patterns:
      - pattern: "const $X: Repository = { ... }"
  - id: kiko-money-column-integer-minor-units
    languages: [typescript]
    severity: ERROR
    message: >
      Money columns are stored as integer minor units, never as floating-point
      `real`/`decimal`/`numeric`. Use `integer('..._minor_units')`.
    paths:
      include:
        - "schema.ts"
    patterns:
      - pattern-either:
          - pattern: real($NAME)
          - pattern: decimal($NAME)
          - pattern: numeric($NAME)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(minor_units|amount|balance).*
  - id: kiko-component-rest-props-named-props
    languages: [typescript]
    severity: ERROR
    message: >
      A component's rest-props binding is named `props`, not `rest`. Destructure
      `const { someOwnProp, ...props } = ...` so the spread reads `{...props}`.
    paths:
      include:
        - "*.component.tsx"
    patterns:
      - pattern-regex: \.\.\.rest\b
  - id: kiko-first-two-arg-not-curried
    languages: [typescript]
    severity: ERROR
    message: >
      Call `first(result, toError)` with two arguments, never the curried
      `first(toError)(result)` form.
    patterns:
      - pattern: first($X)($Y)
  - id: kiko-no-handrolled-pipe-compose
    languages: [typescript]
    severity: ERROR
    message: >
      Do not hand-roll `pipe`/`compose`. Import the composition helpers from
      `fnts` instead of defining them locally.
    patterns:
      - pattern-either:
          - pattern: const pipe = $F
          - pattern: const compose = $F
  # kiko-code-style's ts-pattern section: `switch` is banned with no exception.
  # Every closed-set branch uses `ts-pattern`'s `match(...).exhaustive()` (or a
  # typed `Record<Literal, X>` for a pure value lookup) instead. AST patterns,
  # not a keyword-regex, so a comment, a string literal, or a `.switch(...)`
  # method call never false-positives — a bare `switch ($X) { ... }` does not
  # match a switch's case-clause list, so the two arms below anchor on a real
  # `case`/`default` label instead.
  - id: kiko-no-switch
    languages: [typescript]
    severity: ERROR
    message: >
      `switch` is banned, with no exception. Use `ts-pattern`'s
      `match(...).exhaustive()` (or a typed `Record<Literal, X>` for a pure
      value lookup) instead — see kiko-code-style's "ts-pattern for
      exhaustive mapping".
    patterns:
      - pattern-either:
          - pattern: "switch ($X) { case $C: ... }"
          - pattern: "switch ($X) { default: ... }"
  # kiko-code-style's "Banned: the nullable-map ternary" —
  # `x === undefined ? undefined : f(x)` (and the `null`/`== null`/
  # list-or-empty variants) hand-rolls exactly what `fnts`'s `maybe` + `foldMap`
  # already does, without the type making the "might be absent" case visible.
  # Every `pattern-either` branch below is a LITERAL branch shape (the
  # null-like sentinel is `undefined`/`null`/`[]`, spelled out at the exact AST
  # position the comparison operator implies), not a general `$A ? $B : $C` —
  # so a genuine default-value ternary (`x !== null ? f(x) : fallback`, where
  # the fallback is a real value, not one of the three sentinels) never
  # matches, and neither does a validator-error ternary that returns a real
  # message on the ABSENT side and `undefined` on the present side (the
  # opposite polarity from a nullable map) — both verified empirically against
  # the negative fixture. The `===`/`==`-first and `!==`/`!=`-first pairs cover
  # the direct and "inverted" forms; the `||`/`&&`-joined pairs cover the
  # `x === undefined || x === null ? … : …` spelling of `== null` written out
  # longhand. The `metavariable-pattern` below requires $E to actually
  # reference $X somewhere — without it, a PRESENCE ternary whose present-side
  # branch is a constant unrelated to $X (`label === undefined ? undefined :
  # 'button'`) matches too, even though it is not a map of $X's value at all
  # (both real sites this false-matched are in the negative fixture).
  # Deliberately NOT scoped to `paths.exclude` test files — existing
  # test-file instances are in scope too, unlike the Hermes TextDecoder rule
  # above.
  - id: kiko-no-nullable-map-ternary
    languages: [typescript]
    severity: ERROR
    message: >
      Hand-rolled nullable-map ternary. `x === undefined ? undefined : f(x)`
      (and the `null`/`== null`/list-or-empty variants) duplicates what
      `fnts`'s `maybe` + `foldMap` already does, without the type making the
      "might be absent" case visible at the call site. Use
      `foldMap(maybe(x), (value) => f(value))` instead (append `?? []` for the
      list-or-empty form) — see kiko-code-style's "Banned: the nullable-map
      ternary".
    patterns:
      - pattern-either:
          - pattern: "$X === undefined ? undefined : $E"
          - pattern: "$X === undefined ? null : $E"
          - pattern: "$X === undefined ? [] : $E"
          - pattern: "$X === null ? undefined : $E"
          - pattern: "$X === null ? null : $E"
          - pattern: "$X === null ? [] : $E"
          - pattern: "$X == null ? undefined : $E"
          - pattern: "$X == null ? null : $E"
          - pattern: "$X == null ? [] : $E"
          - pattern: "$X == undefined ? undefined : $E"
          - pattern: "undefined === $X ? undefined : $E"
          - pattern: "$X !== undefined ? $E : undefined"
          - pattern: "$X !== undefined ? $E : null"
          - pattern: "$X !== undefined ? $E : []"
          - pattern: "$X !== null ? $E : undefined"
          - pattern: "$X !== null ? $E : null"
          - pattern: "$X !== null ? $E : []"
          - pattern: "$X != null ? $E : undefined"
          - pattern: "$X != null ? $E : null"
          - pattern: "$X != null ? $E : []"
          - pattern: "$X != undefined ? $E : undefined"
          - pattern: "$X === undefined || $X === null ? undefined : $E"
          - pattern: "$X === null || $X === undefined ? undefined : $E"
          - pattern: "$X === undefined || $X === null ? null : $E"
          - pattern: "$X === null || $X === undefined ? null : $E"
          - pattern: "$X === undefined || $X === null ? [] : $E"
          - pattern: "$X === null || $X === undefined ? [] : $E"
          - pattern: "$X !== undefined && $X !== null ? $E : undefined"
          - pattern: "$X !== null && $X !== undefined ? $E : undefined"
          - pattern: "$X !== undefined && $X !== null ? $E : null"
          - pattern: "$X !== null && $X !== undefined ? $E : null"
          - pattern: "$X !== undefined && $X !== null ? $E : []"
          - pattern: "$X !== null && $X !== undefined ? $E : []"
      - metavariable-pattern:
          metavariable: $E
          patterns:
            - pattern: <... $X ...>
  # skill-gap-analysis #16. AST `pattern:` (not `pattern-regex`), so a
  # comment merely naming `useAnimatedKeyboard` — several already exist,
  # documenting the crash this rule guards against, see
  # `bottom-sheet.component.tsx`/`.keyboard.ts` — never matches; Semgrep
  # patterns match the parsed syntax tree, not raw text. See
  # `kiko-gestures`'s "`useAnimatedKeyboard()` is banned" section for the
  # full crash chain (`REAKeyboardEventObserver` reaches
  # `AppDelegate.window`, which this app's UIScene lifecycle does not set).
  - id: kiko-no-use-animated-keyboard
    languages: [typescript]
    severity: ERROR
    message: >
      `useAnimatedKeyboard()` is banned. Its native observer reaches
      `[[UIApplication sharedApplication] delegate] window]`, a legacy
      AppDelegate-owns-the-window assumption — this app runs the iOS UIScene
      lifecycle (SceneDelegate owns the UIWindow; AppDelegate has none), so it
      SIGABRTs on cold launch. Drive keyboard height from RN core `Keyboard`
      events instead, the way `bottom-sheet.component.tsx` does.
    patterns:
      - pattern: useAnimatedKeyboard(...)
  # skill-gap-analysis #16. Hermes has no working `TextDecoder` — confirmed
  # on device, it silently produced unparseable output (see
  # `src/data-transfer/utf8/utf8.ts`'s header comment) — so `TextEncoder`/
  # `TextDecoder` are banned under `src/` in favor of the hand-rolled
  # `utf8Encode`/`utf8Decode`. Test files are exempted (`paths.exclude`,
  # basename patterns, no directory-prefix gotcha to worry about): Jest runs
  # on Node, where both are real, working globals, and
  # `src/data-transfer/utf8/utf8.test.ts` / `crypto/envelope.test.ts`
  # deliberately use the real `TextEncoder` as the byte-for-byte oracle the
  # hand-rolled encoder is tested against — banning it there would remove the
  # only independent check that `utf8Encode` is standard-conforming.
  - id: kiko-no-textdecoder-textencoder
    languages: [typescript]
    severity: ERROR
    message: >
      `TextDecoder`/`TextEncoder` are banned under src/ — Hermes has no
      working implementation (confirmed on device: `TextDecoder` silently
      produced unparseable output). Use `utf8Encode`/`utf8Decode`
      (`src/data-transfer/utf8`) instead.
    paths:
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
    patterns:
      - pattern-either:
          - pattern: new TextDecoder(...)
          - pattern: new TextEncoder(...)
  # Mechanizes kiko-code-style's "Comments: WHY only, never history" —
  # Class A (ERROR): see kiko-linter's own "kiko-no-history-id-comment"
  # section for the id-family list, the string-skip anchor, the false
  # positive tuning, and the paths.exclude scope reasoning (design notes
  # live there ONCE, not duplicated here).
  - id: kiko-no-history-id-comment
    languages: [typescript]
    severity: ERROR
    message: >
      A comment cites a task id, review-round id, spec/decision id, or a bug
      number. kiko-code-style's "Comments: WHY only, never history": that
      belongs in the commit message that made the change, or the skill
      section that owns the rule — never left behind in a comment. Drop the
      id and keep the WHY; if nothing but history remains, delete the
      comment. If this is a real domain word that only coincidentally reads
      like one of these ids, reword the comment to avoid the shape.
    paths:
      exclude:
        - "__tests__/**"
        - "e2e/**"
        - "scripts/**"
        - "harness/**"
        - "App.tsx"
        - "drizzle.config.ts"
    patterns:
      - pattern-either:
          - pattern-regex: '^(?:[^''"`\n]|''[^''\n]*''|"[^"\n]*"|`[^`\n]*`)*(?<!:)//.*\b(T\d{1,3}|I\d{1,3}|M\d{1,3}|N\d{1,3}|U\d{1,3}|D\d{1,3}|R\d{1,3}|F\d{1,3}|G\d{1,3}|C\d{1,3}|bug\s\d+|spec\s\d|Task\s\d+|Requirement\s[A-Z]|[Cc]ontroller\sruling\s\d+|section\s[A-Z]\.\d|(?:task|parity)\sbrief(?:''s)?|per\sthe\sbrief|the\sbrief''s|Review\sFocus\s\d+|Minor\s\d+|audit\s\d+|RULING\sR\d+|fix\sround\s\d+|round-\d+|device[- ]feedback|on-device\sreview|USER-DECISION)\b'
          - pattern-regex: '^(?:[^''"`\n]|''[^''\n]*''|"[^"\n]*"|`[^`\n]*`)*/\*(?:(?!\*/)[\s\S])*?\b(T\d{1,3}|I\d{1,3}|M\d{1,3}|N\d{1,3}|U\d{1,3}|D\d{1,3}|R\d{1,3}|F\d{1,3}|G\d{1,3}|C\d{1,3}|bug\s\d+|spec\s\d|Task\s\d+|Requirement\s[A-Z]|[Cc]ontroller\sruling\s\d+|section\s[A-Z]\.\d|(?:task|parity)\sbrief(?:''s)?|per\sthe\sbrief|the\sbrief''s|Review\sFocus\s\d+|Minor\s\d+|audit\s\d+|RULING\sR\d+|fix\sround\s\d+|round-\d+|device[- ]feedback|on-device\sreview|USER-DECISION)\b(?:(?!\*/)[\s\S])*?\*/'
  # ---- Class B: override-eligible finding (severity WARNING) ----
  - id: kiko-webview-injectedjs-dynamic
    languages: [typescript, javascript]
    severity: WARNING
    message: >
      WebView injectedJavaScript built from a variable can run attacker code
      in the web context. Confirm the input is constant or fully sanitized,
      or add an OVERRIDE noting why it is safe.
    patterns:
      - pattern: <WebView injectedJavaScript={$X} ... />
      - metavariable-regex:
          metavariable: $X
          regex: ^(?!["'`]).*$
  # Taint propagates through an intervening call's return value, so
  # `const info = await fetchClientInfo(token); setName(info.name)` is flagged
  # too (verified). That is intended, not a false positive — a value derived
  # from a secret can leak it — and it is why this is Class B / override-eligible
  # rather than a hard fail. Verified to report NOTHING on the real tree today.
  - id: kiko-no-keychain-secret-into-usestate
    languages: [typescript]
    severity: WARNING
    mode: taint
    message: >
      A Keychain secret is flowing into React state. A stored token or key must
      never be parked in the React tree — a jailbroken device or an attached
      debugger can read the JS heap, and a `secureTextEntry` field displays
      nothing anyway. Expose a boolean "saved" indicator instead and require
      re-entry, or use the value transiently inside the handler. If a case is
      genuinely safe, add an OVERRIDE(...) saying why.
    pattern-sources:
      - patterns:
          - pattern: $READ(...)
          - metavariable-regex:
              metavariable: $READ
              regex: ^(readToken|readCredentials|readDbKey)$
    pattern-sinks:
      - patterns:
          - pattern: $SET($X)
          - metavariable-regex:
              metavariable: $SET
              regex: ^set[A-Z]
  # Companion to the taint rule above. Semgrep 1.175's taint engine does not
  # propagate through a `.then(callback)` parameter — `pattern-propagators`
  # (from: $P, to: $V) and a `focus-metavariable: $V` source were both tried and
  # match nothing — and the deep-expression form `(($V) => { <... $SET($V) ...> })`
  # does not match either. The `.then` shape is exactly the one finding S5 found,
  # so it is flagged syntactically instead: routing a Keychain reader's result
  # through a promise callback in a component is the prefill anti-pattern, and
  # the project has no legitimate instance of it.
  # This rule has its OWN fixture pair
  # (rules/fixtures/kiko-no-keychain-secret-through-then.{bad,good}.ts), not a
  # borrowed one: the fixture harness (scripts/checks/semgrep-rules.sh) only
  # credits a rule id against the fixture whose FILENAME names that id, so a
  # finding this rule produces on a fixture named for a different rule id (the
  # taint rule's `.bad.ts`) proves nothing about this rule — a broken
  # metavariable-regex here would still pass `check:rules` silently without a
  # dedicated fixture (verified: this was the exact gap the reviewer caught).
  - id: kiko-no-keychain-secret-through-then
    languages: [typescript]
    severity: WARNING
    message: >
      A Keychain reader's result is being routed through a `.then` callback.
      That is the prefill anti-pattern from security finding S5: the secret ends
      up in React state. Await it inside an async handler and use it transiently,
      or probe existence with a boolean helper (`hasToken`). If a case is
      genuinely safe, add an OVERRIDE(...) saying why.
    patterns:
      - pattern: $READ(...).then($F)
      - metavariable-regex:
          metavariable: $READ
          regex: ^(readToken|readCredentials|readDbKey)$
  # kiko-domain "Money at the boundary" (D7b): a holding's raw
  # `balanceMinorUnits` column is converted to `Money` in exactly one place,
  # `holdingsRepo.balanceOf`. A `.balanceMinorUnits` member read anywhere else
  # is either a repo/db/data-transfer boundary (excluded below) or a value
  # read that should go through `balanceOf` instead. Class B: a screen-layer
  # read of a field NAMED `balanceMinorUnits` on some other, unrelated object
  # shape is possible in principle (Semgrep matches the member name
  # syntactically, not by the object's inferred type), so this is
  # override-eligible rather than a hard fail.
  - id: kiko-balance-through-repo
    languages: [typescript]
    severity: WARNING
    message: >
      A `.balanceMinorUnits` member read outside a repository. Convert the
      raw stored balance to `Money` through `holdingsRepo.balanceOf(row)`
      (kiko-domain "Money at the boundary") instead of reading the column
      directly. If this is genuinely inside a repository boundary the
      exclusions below don't yet cover, add an OVERRIDE noting why.
    paths:
      exclude:
        - "src/**/repo/**"
        - "src/accounts/accounts.repo.ts"
        - "src/db/**"
        - "src/data-transfer/**"
        - "*.test.ts"
        - "*.test.tsx"
    patterns:
      - pattern: $X.balanceMinorUnits
