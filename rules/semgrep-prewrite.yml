  # operator does not reach a block's non-return statements, hence the
  # separate block arm). The inner pass must iterate a plain identifier, a
  # collection that stays the same for every outer item: an inner pass over
  # the outer item's own member (`holding.rows`) or a chain off a lookup
  # (`(byId.get(holding.id) ?? [])`) visits each row once, which is linear,
  # and a `pattern-not` on the collection does not drop the lookup chain.
  # Tests are excluded: a parity oracle in a test may
  # keep the slow per-bucket shape on purpose, and test code never runs in a
  # Statistics render. ERROR from the start: 0 findings in src.
  - id: kiko-no-per-bucket-date-in-statistics
    languages: [typescript]
    severity: ERROR
    message: >
      A Date is built inside an array callback that itself runs once per
      bucket (inside another array callback or a loop): O(buckets × rows)
      Date work on every Statistics render. Precompute each row's day key
      ONCE, outside the per-bucket iteration.
    metadata:
      fix: "Build the per-row day key (startOfLocalDay/new Date) once before the bucket loop (a Map or prefix sum), then compare plain numbers inside it."
      skill: "kiko-domain › Statistics series performance"
    paths:
