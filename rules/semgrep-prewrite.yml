  # kiko-domain's "Statistics series performance": a Date built per row
  # INSIDE a per-bucket iteration is O(buckets x rows) on every Statistics
  # render. Only the nested shape fires; a one-off per-row pass stays silent,
  # because flagging every Date in an array callback could not tell the two
  # apart. The outer iteration is a `for`/`while` loop or another array
