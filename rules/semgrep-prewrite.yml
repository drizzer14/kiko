        - "src/statement-import/**"
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
    pattern-either:
      - patterns:
          - pattern: $DATE.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^((get|set)(FullYear|Month|Date|Hours|Minutes|Seconds|Milliseconds)|getDay|getTimezoneOffset)$
      - pattern: Date.parse(...)
      - pattern: new Date("...")
      - pattern: new Date(`...`)
      - pattern: "new Date(($TEXT: string))"
      - patterns:
