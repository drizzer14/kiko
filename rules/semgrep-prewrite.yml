  # Statement import reads every bank wall clock in a fixed source zone
  # (Kyiv, or a column mapping's own zone), so a row's time and its dedup
  # key never depend on the phone's zone: a device-zone read gives the same
  # file a new key once the phone changes zone, and an overlapping
  # re-import duplicates every row. The local-time constructor is
  # `kiko-no-date-utc-in-statement-import`'s; this rule covers the other ways
  # a device-zone read slips back in — a local `Date` getter or setter,
  # `getTimezoneOffset`, `Date.parse`, a string, string-variable, or
  # template-literal `new Date(...)`, a `toLocale*` render with no
  # `timeZone` option, a `toString`/`toDateString`/`toTimeString` render, a
  # `Date` turned into text by `String(...)`, a template literal, or `+`, an
  # `Intl.DateTimeFormat` with no `timeZone`, and the `@kiko/dates`
  # local-day helpers. The `toLocale*`, `String`, template, and `+` patterns
  # are typed, so a number's `toLocaleString` stays allowed; the cost is
  # that a `Date` whose type Semgrep cannot see (an `any`, say) is not
  # caught there. A `new Date(text)` whose argument TypeScript cannot type
  # as `string` (an untyped `TableCell`, say) is not caught either. The
  # display formatters (`formatDate`, used by preview-stats) stay allowed:
  # they only render a stored instant, never produce one. `paths.include` is
  # path-prefixed, so the fixture pair is NESTED. ERROR: the tree has no
  # finding.
  - id: kiko-no-device-zone-in-statement-import
    languages: [typescript]
    severity: ERROR
    message: >
      Statement import reads every bank wall clock in a fixed source zone,
      never the device's own, so a row's dedup key stays the same wherever
      the phone is. A local `Date` getter/setter, `getTimezoneOffset`,
      `Date.parse`, a string or template-literal `new Date(...)`, a
      `toLocale*` call with no `timeZone`, a
      `toString`/`toDateString`/`toTimeString` call, a `Date` turned into
      text by `String(...)`, a template literal, or `+`, an
      `Intl.DateTimeFormat` with no `timeZone`, or
      `startOfLocalDay`/`endOfLocalDay` reads the device zone.
    metadata:
      fix: "Read wall-clock digits with kyivWallClockToUtcMilliseconds/zoneWallClockToUtcMilliseconds, an instant's wall clock with zoneWallClockOf, and stored digits with utcDigitsOf (@kiko/dates), never a local Date getter, Date.parse, a locale render, or a device-local day helper."
      skill: "kiko-statement-import › Column mapping"
    paths:
