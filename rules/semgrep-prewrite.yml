          - pattern: 'fallbackLabel: "..."'
  # kiko-linter's "Backlog: a rule for a plain function called inside a
  # worklet" / kiko-gestures' "Every function called inside a worklet needs
  # its own 'worklet' directive". A same-file helper (a `const` arrow or a
  # `function`) called synchronously inside a reanimated worklet-hook
  # callback (`useAnimatedStyle`, `useDerivedValue`, `useAnimatedReaction`,
  # `useAnimatedScrollHandler`, `runOnUI`, or a `Gesture.$G().$ON(...)`
  # worklet callback) that has no `'worklet'` directive as ITS OWN first
  # statement is captured as a "remote function" by the worklets runtime —
  # invisible to `tsc` and Jest (the worklet runtime is mocked there, and a
  # DEBUG build only warns), and it only SIGABRTs on first render in a
  # RELEASE build (builds 15/16 shipped exactly this bug, see memory
  # `worklet-directive-debug-swallows-release-aborts`). A heuristic (spec
  # rule 15): false negatives are accepted, but false positives must stay
  # rare. The "$F declared somewhere in this file" half is NOT expressed
  # with a `pattern-inside` wrapping the hook (pattern-inside requires the
  # CALL to be a descendant of the declaration, which is never true for two
  # sibling statements) — it is a leading/trailing `...`-bounded statement
  # sequence instead (`... const $F = (...) => { ... } ...`), which Semgrep
  # matches against ANY enclosing statement list, verified empirically. That
  # same generality is exactly why a helper defined INLINE, directly inside
  # the worklet callback (safe — already part of that worklet's own closure,
  # never captured remotely, per kiko-gestures), would otherwise ALSO match
  # this sequence pattern (its own immediately-enclosing block IS such a
  # statement list) and false-positive: the two block-shaped
  # `pattern-not-inside` arms at the bottom exist to exclude precisely that
  # shape — scoped to `$HOOK(..., (...) => { ... const $F = ... } ...)`
  # (the callback argument literally passed TO the hook call), not a bare
  # `(...) => { ... }`: an unscoped arrow shape also matches a COMPONENT's or
  # custom hook's own OUTER arrow body (any `(...) => { ...; useAnimatedStyle
  # ...; ... }` containing both the helper and the hook call as sibling
  # statements), which wrongly excluded that same-file, still-untagged helper
  # too — verified empirically against a throwaway inline-arrow probe before
  # writing this. A function imported from ANOTHER file is a known false
  # negative — no local declaration to match — and `Gesture.$G().$ON(...)`
  # only matches that literal two-hop chain, not this codebase's real,
  # further-chained gesture builders (`.minDuration(...).runOnJS(true)
  # .onStart(...)`, see `card-context-menu.component.tsx`/
  # `bottom-sheet.component.tsx`), both accepted per the heuristic — a real
  # sweep of `src App.tsx __tests__ e2e` drew 0 findings. The call match is
  # focused on a function (or handler-object) ARGUMENT of the hook
  # (`focus-metavariable: $CALLBACK`), not the whole hook call: a helper
  # called in the dependency argument (`useAnimatedStyle(() => ...,
  # deps(1))`) runs on the JS thread and is never captured by the worklet,
  # so a whole-call `pattern-inside` false-positived on it. Test files are
  # excluded: Jest mocks reanimated, so no worklet runtime ever captures a
  # helper there and the Release-only SIGABRT cannot happen; and the
  # `$F(...)` x statement-sequence match is quadratic on a large test file
  # whose "Gesture" substrings (`fireGestureHandler`, `GestureRootWrapper`)
  # defeat Semgrep's prefilter, which crossed the per-rule timeout under
  # load and made the guard deny "could not check" at random.
  - id: kiko-worklet-directive-required
    languages: [typescript]
    severity: ERROR
    paths:
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
        - "__tests__/**"
        - "e2e/**"
    message: >
      A same-file helper called inside a reanimated worklet-hook callback
      (`useAnimatedStyle`, `useDerivedValue`, `useAnimatedReaction`,
      `useAnimatedScrollHandler`, `runOnUI`, or a `Gesture...onStart`/
      `onUpdate`/`onEnd`/`onFinalize`-style worklet callback) has no
      `'worklet'` directive as its own first statement. The worklets runtime
      captures it as a "remote function" instead — invisible to `tsc` and
      Jest, and it only SIGABRTs on first render in a RELEASE build — see
      kiko-gestures' "Every function called inside a worklet needs its own
      'worklet' directive".
    metadata:
      fix: "Add `'worklet';` as the helper's own first statement, or inline the logic directly in the worklet callback instead."
      skill: "kiko-gestures › Every function called inside a worklet needs its own 'worklet' directive"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: "useAnimatedStyle(..., $CALLBACK, ...)"
                  - pattern: "useDerivedValue(..., $CALLBACK, ...)"
                  - pattern: "useAnimatedReaction(..., $CALLBACK, ...)"
                  - pattern: "useAnimatedScrollHandler(..., $CALLBACK, ...)"
                  - pattern: "runOnUI(..., $CALLBACK, ...)"
                  - pattern: "Gesture.$G().$ON(..., $CALLBACK, ...)"
              - metavariable-pattern:
                  metavariable: $CALLBACK
                  pattern-either:
                    - pattern: "(...) => $BODY"
                    - pattern: "function (...) { ... }"
                    - pattern: "{ ... }"
              - focus-metavariable: $CALLBACK
      - pattern: $F(...)
      - pattern-either:
          - pattern-inside: |
              ...
              const $F = (...) => { ... }
              ...
          - pattern-inside: |
              ...
              function $F(...) { ... }
              ...
      - pattern-not-inside: |
          ...
          const $F = (...) => { 'worklet'; ... }
          ...
      - pattern-not-inside: |
          ...
          function $F(...) { 'worklet'; ... }
          ...
      - pattern-not-inside: |
          $HOOK(..., (...) => {
            ...
            const $F = (...) => { ... }
            ...
          }, ...)
      - pattern-not-inside: |
          $HOOK(..., (...) => {
            ...
            function $F(...) { ... }
            ...
          }, ...)
  # kiko-design-system's "Component set (Button)" — the account-detail Sync
  # button ("accountDetail.syncNow") is pinned to `variant="secondaryTonal"`
  # everywhere it appears. Arm one captures an explicit `variant` as
  # `$VARIANT` (a bare `t(...)` child, or the `isSyncing ? ... : ...`
  # ternary in BOTH branch orders, since a ternary pattern only matches the
  # order it names) and rejects every value but `secondaryTonal`; arm two
  # catches a Button with NO `variant` (it defaults to `primary`). Why each
  # arm is its own `patterns:` list with a `metavariable-regex` exclusion,
  # never `pattern-regex` plus a negative filter: kiko-linter's "Semgrep facts".
  - id: kiko-pinned-sync-button-variant
    languages: [typescript]
    severity: ERROR
    message: >
      The Sync button ("accountDetail.syncNow") is pinned to
      `variant="secondaryTonal"` everywhere it appears — see
      kiko-design-system's "Component set (Button)".
    metadata:
      fix: 'Use `variant="secondaryTonal"` on the Sync Button instead of any other variant.'
      skill: "kiko-design-system › Component set (Button)"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      <Button ... variant="$VARIANT" ...>
                        {t('accountDetail.syncNow')}
                      </Button>
                  - pattern: |
                      <Button ... variant="$VARIANT" ...>
                        {$COND ? $A : t('accountDetail.syncNow')}
                      </Button>
                  - pattern: |
                      <Button ... variant="$VARIANT" ...>
                        {$COND ? t('accountDetail.syncNow') : $A}
                      </Button>
              - metavariable-regex:
                  metavariable: $VARIANT
                  regex: "^(?!secondaryTonal$).*$"
          - patterns:
              - pattern: |
                  <Button ...>
                    {t('accountDetail.syncNow')}
                  </Button>
              - pattern-not: |
                  <Button ... variant=$VARIANT ...>
                    {t('accountDetail.syncNow')}
                  </Button>
  # kiko-design-system's "Component set (Button)" — the account-detail Change
