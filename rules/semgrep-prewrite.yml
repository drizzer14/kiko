          - metavariable-regex:
              metavariable: $RENDER
              regex: ^toLocale(Date|Time)?String$
          - pattern-not: "$RECEIVER.$RENDER($LOCALE, {..., timeZone: $ZONE, ...})"
      - pattern: "String(($DATE: Date))"
      - pattern: "`...${($DATE: Date)}...`"
      - pattern: "$TEXT + ($DATE: Date)"
      - pattern: "($DATE: Date) + $TEXT"
      - pattern: $DATE.toDateString()
      - pattern: $DATE.toTimeString()
      - pattern: new Date(...).toString()
      - pattern: "($DATE: Date).toString()"
      - patterns:
          - pattern-either:
              - pattern: new Intl.DateTimeFormat(...)
              - pattern: Intl.DateTimeFormat(...)
          - pattern-not: "new Intl.DateTimeFormat($LOCALE, {..., timeZone: $ZONE, ...})"
          - pattern-not: "Intl.DateTimeFormat($LOCALE, {..., timeZone: $ZONE, ...})"
      - pattern: startOfLocalDay(...)
      - pattern: endOfLocalDay(...)
  # kiko-code-style's "JSX spread: no `{}` fallback": TypeScript merges a JSX
  # spread of `X | {}` into one shape with every prop of X optional, so a
  # discriminated union's required-together props (SettingsRowProps: a
  # pressable row's `trailing` needs `accessibilityActions` and
  # `onAccessibilityAction`) stop being enforced and the row compiles without
  # them. A pattern `{}` matches ANY object literal, so the fallback is
  # captured and `metavariable-regex` keeps only a truly empty one; a ternary
  # of two filled objects (SelectableRow's glyph) stays clean. An object
  # spread outside JSX checks no component's props and is out of scope.
  # `paths.include` is path-prefixed, so the fixture pair is NESTED. ERROR
  # from the start: the tree had no finding when the rule landed.
  - id: kiko-no-empty-object-jsx-spread
    languages: [typescript]
    severity: ERROR
    message: >
      A JSX spread whose fallback is `{}` makes every prop of the spread
      value optional, so a discriminated union's required-together props
      stop being enforced. Fall back to a non-empty literal that names the
      discriminant (`NO_SWITCH = { trailing: undefined }` in
      `reminder-row.component.tsx`) — see kiko-code-style's "JSX spread: no
      `{}` fallback".
    metadata:
      fix: "Replace the `{}` fallback with a named constant that sets the discriminant, e.g. `const NO_SWITCH = { trailing: undefined }` and `{...(props ?? NO_SWITCH)}`."
      skill: "kiko-code-style › JSX spread: no `{}` fallback"
    paths:
      include:
        - "src/**/*.tsx"
    patterns:
      - pattern-either:
          - pattern: "<$ELEMENT ... {...($VALUE ?? $FALLBACK)} ... />"
          - pattern: "<$ELEMENT ... {...($VALUE || $FALLBACK)} ... />"
          - pattern: "<$ELEMENT ... {...($CONDITION ? $VALUE : $FALLBACK)} ... />"
          - pattern: "<$ELEMENT ... {...($CONDITION ? $FALLBACK : $VALUE)} ... />"
      - metavariable-regex:
          metavariable: $FALLBACK
          regex: '^\{\s*\}$'
  # kiko-code-style's "`fnts` FIRST": fnts' `either(value)` runs `value()`
  # OUTSIDE its own promise chain, so `either(f)` catches the same failures
  # as `either(async () => f())` only when `f` itself is `async`; a plain `f`
  # that throws synchronously needs the wrapper (account-form's
  # `ensureAccount`). Hence the rule fires only for a bare identifier `f`
  # (a method call would lose `this`) declared `async` in this file. Semgrep
  # ignores an arrow's `async` in a pattern, hence the captured initializer
  # plus `metavariable-regex`. Never open either `pattern-inside` with `...`:
  # it times out on large files. Timings and the known limit: kiko-linter's
  # "Semgrep facts verified on 2026-09-29".
  - id: kiko-no-needless-async-either-thunk
    languages: [typescript]
    severity: ERROR
    message: >
      This thunk passed to `either` only calls `$F`, which is declared
      `async` in this file, so the wrapper adds nothing: `either($F)` calls it
      the same way and captures the same rejections as a Left — see
      kiko-code-style's "`fnts` FIRST".
    metadata:
      fix: "Pass the async function itself: `either(f)` instead of `either(async () => f())` or `either(async () => await f())`."
      skill: "kiko-code-style › `fnts` FIRST"
    patterns:
      - pattern-either:
          - pattern: "either(async () => $F())"
          - pattern: "either(async () => await $F())"
          - pattern: "either(async () => { return $F(); })"
          - pattern: "either(async () => { return await $F(); })"
          - pattern: "either(async (...$REST: $TYPE) => $F(...$REST))"
      - metavariable-regex:
          metavariable: $F
          regex: '^[A-Za-z_$][\w$]*$'
      - pattern-either:
          - pattern-inside: |
              async function $F(...) { ... }
              ...
          - patterns:
              - pattern-inside: |
                  const $F = $INITIALIZER;
                  ...
              - metavariable-regex:
                  metavariable: $INITIALIZER
                  regex: '^(async\b|useCallback\(\s*async\b)'
