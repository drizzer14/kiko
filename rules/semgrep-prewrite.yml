  # The design-system Button defaults `fullWidth` to true
  # (button.component.tsx), so a bare `fullWidth` or `fullWidth={true}` only
  # restates the default. How the one pattern covers both spellings, and its
  # limits: this rule's row in docs/harness/review-to-biome-inventory.md.
  - id: kiko-no-redundant-button-full-width
    languages: [typescript]
    severity: ERROR
    message: >
      Redundant `fullWidth` on the design-system Button. It defaults to
      `true`, so a bare `fullWidth` or `fullWidth={true}` restates the
      default. Drop the prop; pass only `fullWidth={false}` for an
      intrinsic-width button — see kiko-design-system's "Component set
      (Button)".
    metadata:
      fix: "Remove the bare `fullWidth` / `fullWidth={true}` from the Button; it already defaults to true. Pass only `fullWidth={false}`."
      skill: "kiko-design-system › Component set (Button)"
    pattern: <Button ... fullWidth={true} ... />
  # kiko-domain's "Exchange/Convert legs": a blank row's fallback label has ONE
  # owner, `transactionRowDescription`, which tries the exchange-leg label
  # before the holding-name default. A surface calling
  # `defaultTransactionDescription` itself skips that branch — the transaction
  # form's description placeholder did, and an edited exchange leg previewed
  # "<holding> expense" while the list showed "Exchange to <holding>".
  # `row-description/**` is the owner; `default-description/**` holds the
  # helper and its own unit test.
  - id: kiko-no-direct-default-transaction-description
    languages: [typescript]
    severity: ERROR
    message: >
      `defaultTransactionDescription` is called outside its one owner. Resolve a
      blank transaction's label (list row, preview, or form placeholder) with
      `transactionRowDescription` from `@kiko/transactions/row-description`, so an
      exchange leg reads "Exchange to/from <counterpart>" (or "Transfer to/from
      <counterpart>" for a same-currency pair) everywhere.
    metadata:
      fix: "Call `transactionRowDescription({ transaction, holdingName, holdingNameById, holdingCurrencyById, t })` from `@kiko/transactions/row-description` instead of `defaultTransactionDescription`."
      skill: "kiko-domain › Exchange/Convert legs: a structural marker, a resolved label"
    paths:
      exclude:
        - "src/transactions/row-description/**"
        - "src/transactions/default-description/**"
    pattern: defaultTransactionDescription(...)
  # category-trend.ts's own `groupKey` used to fold with a bare
  # `category?.toLowerCase() || defaultKey` — it caught a null/empty category
  # but not an UNRESOLVABLE one (a slug no longer in the categories table),
  # so a deleted seeded category rendered as two same-titled,
  # differently-keyed lines instead of folding into one, unlike the donut
  # (`resolveCategoryKey`). The SAME shape recurred at
  # `holding-detail.screen.tsx`'s ledger-row icon color, outside
  # `src/statistics/**` — the rule now covers all of `src/**`. `paths.include`
  # still draws nothing against a flat fixture (kiko-linter's "Semgrep
  # facts"), so this rule's fixture pair stays NESTED at
  # rules/fixtures/kiko-no-bare-lowercase-category-fold/src/statistics/ (that
  # path is still a valid `src/**` match).
  - id: kiko-no-bare-lowercase-category-fold
    languages: [typescript]
    severity: ERROR
    message: >
      A bare `<category>?.toLowerCase() || <default>` category fold only
      catches a null/empty category, not an UNRESOLVABLE one (a slug no
      longer in the categories table) — the donut and every other consumer
      fold that case too, via `resolveCategoryKey`. Use
      `resolveCategoryKey(category, categoryDisplay, defaultKey)` from
      `@kiko/categories/category-display` instead.
    metadata:
      fix: "Use resolveCategoryKey(category, categoryDisplay, defaultKey) from @kiko/categories/category-display instead of a bare `?.toLowerCase() || default` fold."
      skill: "kiko-domain › Category color resolution"
    paths:
      include:
        - "src/**"
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
    patterns:
      - pattern-either:
          - pattern: $CATEGORY?.toLowerCase() || $DEFAULT
          - pattern: $CATEGORY.toLowerCase() || $DEFAULT
  # kiko-architecture's "Native iOS shell": the reminders TurboModule spec
  # (`NativeKikoReminders.ts`) calls `TurboModuleRegistry.getEnforcing` at
  # module load, which throws on a binary built without the module. Only the
  # wrapper (`reminders-native.ts`) may load it, lazily on first use, so that
  # importing reminders code can never crash the app at startup; `jest/setup.js`
  # mocks it. A `pattern-regex`, not an AST pattern, because a module path is a
  # plain string literal. It covers a value `import ... from`, a side-effect
  # `import '...'`, a value `export ... from`, `require(...)` and a dynamic
  # `import(...)`. `import type` / `export type` stay allowed (Babel erases
  # them): the `(?!\s+type\b)` lookahead sits right after the keyword, so extra
  # whitespace cannot backtrack past it. An `import`/`export` statement must
  # start its line (Biome's formatting guarantees it), and nothing between the
  # keyword and `from` may hold a quote. Without both, the word "import" in a
  # comment or a string matched across lines up to a later quoted path.
  # `jest.mock`/`doMock`/`requireMock` name the file without loading it, so
  # they never match. The module name must end the path (optionally with
  # `.ts`), so a sibling like `NativeKikoRemindersX` never matches. The block
  # scalar keeps the regex free of YAML escaping.
  - id: kiko-no-native-reminders-module-import
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      Only `src/reminders/native/reminders-native.ts` may load the
      `NativeKikoReminders` TurboModule spec, lazily on first use:
      `TurboModuleRegistry.getEnforcing` throws at module load on a binary
      built without the module. Call `remindersNative` from
      `@kiko/reminders/native` instead; a type-only `import type` is fine.
    metadata:
      fix: "Call `remindersNative` from `@kiko/reminders/native` (or use `import type` for a type); never value-import `NativeKikoReminders`."
      skill: "kiko-architecture › Native iOS shell"
    paths:
      exclude:
        - "src/reminders/native/reminders-native.ts"
        - "jest/setup.js"
    patterns:
      - pattern-regex: |-
          (?m)(?:^[ \t]*import(?!\s+type\b)\s+[^;'"]*?\bfrom\s*|^[ \t]*export(?!\s+type\b)\s+[^;'"]*?\bfrom\s*|^[ \t]*import\s*|\b(?:require|import)\s*\(\s*)['"](?:[^'"]*/)?NativeKikoReminders(?:\.tsx?)?['"]
  # kiko-domain's "Dates": `jest.config.js` pins `process.env.TZ` to
  # Europe/Kyiv at config load, and Jest gives each test sandbox its own copy
  # of `process.env`, so an assignment in a test file, a `beforeAll`, or a
  # test-support helper never reaches Node's TZ setter: `Date` stays on Kyiv
  # and a test that names another zone silently does not test it. ERROR: the
  # tree has no finding left, so `check:security` fails on any new one.
  # `paths.include` names the test paths because app
  # code never assigns TZ at all; the `src/test-support/**` entry is
  # path-prefixed, so the fixture pair is NESTED. `jest.config.js` is the one
  # place the pin belongs.
  - id: kiko-no-process-env-time-zone-in-test
    languages: [typescript]
    severity: ERROR
    message: >
      Assigning `process.env.TZ` in a test is a silent no-op: Jest gives each
      test sandbox its own copy of `process.env`, so `Date` stays on the
      Europe/Kyiv zone `jest.config.js` pins. Inject the offset or zone into
      the code under test instead — see kiko-domain's "Dates".
    metadata:
      fix: "Remove the `process.env.TZ` assignment and inject the offset or zone into the code under test instead."
      skill: "kiko-domain › Dates"
    paths:
      include:
        - "*.test.ts"
        - "*.test.tsx"
        - "src/test-support/**"
        - "__tests__/**"
      exclude:
        - "jest.config.js"
    patterns:
      - pattern-either:
          - pattern: process.env.TZ = $ZONE
          - pattern: process.env['TZ'] = $ZONE
  # kiko-translator's "A test sets the language in a hook, never in an `it` body":
  # a language change inside a test body leaks into every later test when an
  # assertion throws before the reset. WARNING until the tree holds 0 findings for
  # this id: flip to ERROR when check:security reports 0 for it, after the sweep. See
  # kiko-linter's "kiko-no-change-language-in-test-body" section. The
  # `src/test-support/**` include entry is path-prefixed, so the fixture pair is
  # NESTED.
  - id: kiko-no-change-language-in-test-body
    languages: [typescript]
    severity: WARNING
    message: >
      `changeLanguage(...)` runs inside an `it`/`test` body. When an assertion
      throws first, the reset after it never runs and the language leaks into
      every later test. Set the language in a `beforeEach` (inside `act`) and
      reset it to `en` in an `afterEach` — see kiko-translator's "A test sets
      the language in a hook, never in an `it` body".
    metadata:
      fix: "Move the `changeLanguage` call into a `beforeEach` wrapped in `act`, and reset to `en` in an `afterEach`."
      skill: "kiko-translator › A test sets the language in a hook, never in an `it` body"
    paths:
      include:
        - "*.test.ts"
        - "*.test.tsx"
        - "src/test-support/**"
    patterns:
      - pattern: $I18N.changeLanguage(...)
      - pattern-either:
          - pattern-inside: it($NAME, ...)
          - pattern-inside: test($NAME, ...)
          - pattern-inside: it.$MODIFIER($NAME, ...)
          - pattern-inside: test.$MODIFIER($NAME, ...)
          - pattern-inside: it.$MODIFIER(...)($NAME, ...)
          - pattern-inside: test.$MODIFIER(...)($NAME, ...)
  # kiko-code-style's "Comments: WHY only, never history" covers a test title too: a title says
  # what the test pins, never the task id, the ruling id, or the old value it came from. ERROR:
  # the tree holds 0 findings for this id. A title that is not a string or a template literal
  # is out of reach. See kiko-linter's "kiko-test-title-no-history" section. The
  # `src/test-support/**` include entry is path-prefixed, so the fixture pair is NESTED.
  - id: kiko-test-title-no-history
    languages: [typescript]
    severity: ERROR
    message: >
      A test or suite title opens with a task id ("A1 ", "A1:"), opens with a
      ruling id ("ruling A2"), opens with a numbered device check
      ("device check 3"), ends in a task id in parentheses ("(P2)",
      "(task C2)", "(Task C2)"), or carries an old-value label in parentheses.
      kiko-code-style's "Comments: WHY only, never history": a title says what
      the test pins, and the id or the old value belongs in the commit
      message. Drop the id or the label and state the behavior.
    metadata:
      fix: "Rewrite the title to state the behavior the test pins; drop the task id, the ruling id and the old-value label."
      skill: "kiko-code-style › A test title carries no history"
    paths:
      include:
        - "*.test.ts"
        - "*.test.tsx"
        - "src/test-support/**"
    patterns:
      - pattern: $CALLEE($TITLE, ...)
      - metavariable-regex:
          metavariable: $CALLEE
          regex: "^(?:it|test|describe)\\b"
      - metavariable-regex:
          metavariable: $TITLE
          regex: "^[\"'`](?:[A-Z]\\d+[ :]|[Rr]uling [A-Z]\\d|[Dd]evice [Cc]heck \\d|.*\\(was: |.*\\((?:[Tt]ask |spec )?[A-Z]\\d+[),])"
  # A rejection asserted with no expected error passes on any failure, including a typo that
  # throws before the code under test runs. ERROR: the tree holds 0 findings for this id. See
  # kiko-linter's "kiko-rejects-to-throw-needs-error" section. The `src/test-support/**` include
  # entry is path-prefixed, so the fixture pair is NESTED.
  - id: kiko-rejects-to-throw-needs-error
    languages: [typescript]
    severity: ERROR
    message: >
      A `.rejects` assertion that passes on every failure (a bare
      `.rejects.toThrow()` is one; the forms are this rule's patterns) lets a
      test that fails for the wrong reason stay green. Name the error the
      call expects: its message, a pattern, or its own class.
    metadata:
      fix: "Pass the expected error to toThrow: its message (a string), a pattern (a regex) or its class."
      skill: "kiko-code-style › A rejection names its error"
    paths:
      include:
        - "*.test.ts"
        - "*.test.tsx"
        - "src/test-support/**"
    patterns:
      - pattern-either:
          - pattern: $PROMISE.rejects.toThrow()
          - pattern: $PROMISE.rejects.toThrowError()
          - pattern: $PROMISE.rejects.toThrow(Error)
          - pattern: $PROMISE.rejects.toThrowError(Error)
          - pattern: $PROMISE.rejects.toThrow(undefined)
          - pattern: $PROMISE.rejects.toThrowError(undefined)
          - pattern: $PROMISE.rejects.toBeInstanceOf(Error)
          - pattern: $PROMISE.rejects.toBeTruthy()
          - pattern: $PROMISE.rejects.toThrow("")
          - pattern: $PROMISE.rejects.toThrowError("")
          - pattern: $PROMISE.rejects.toThrow(/.*/)
          - pattern: $PROMISE.rejects.toThrowError(/.*/)
          - pattern: $PROMISE.rejects.toEqual(expect.anything())
          - pattern: $PROMISE.rejects.toBeInstanceOf(Object)
          - pattern: $PROMISE.rejects.not.toBeNull()
          - pattern: $PROMISE.rejects.toBeDefined()
  # kiko-gestures' "A lone card lifts too" (under "A hold lifts the card, and a lifted card never opens its
  # page"): `sortEnabled` is the
