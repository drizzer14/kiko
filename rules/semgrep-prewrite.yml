    languages: [typescript]
    severity: WARNING
    message: >
      A ternary on one `kind` literal sends every other variant down the else
      branch, so a new variant of the union falls through silently. Read the
      union with `match(...).with({ kind: ... }, ...).exhaustive()` so a new
      variant is a type error (or give `.with` arms for every variant) — see
      kiko-code-style's "`ts-pattern` for exhaustive mapping". The single
      boolean guard that section allows has no closed-set enum behind it, so
      it does not cover a ternary on the `kind` of a closed union. Keep the
      ternary only when `kind` is not a closed union: mark that site with
      `// nosemgrep: kiko-kind-ternary-prefers-match OVERRIDE(<reason>) <why>`,
      because the pre-write guard denies any new finding whatever its
      severity.
    metadata:
      fix: "Replace the ternary with match(x).with({ kind: '...' }, ...).exhaustive() so a new variant fails to compile; keep it only when kind is not a closed union."
      skill: "kiko-code-style › `ts-pattern` for exhaustive mapping"
    paths:
