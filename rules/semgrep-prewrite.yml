          - pattern: $FS.readFile(...)
          - pattern: createReadStream(...)
          - pattern: $FS.createReadStream(...)
      - pattern-not: $READ("=~/\.(?!tsx?$)\w+$/", ...)
      - pattern-not: $READ($JOIN(..., "=~/\.(?!tsx?$)\w+$/"), ...)
      - pattern-not: $READ($JOIN($PARENT(..., "=~/(^|\/)drizzle\/migrations$/"), ...), ...)
      - pattern-not: $READ($JOIN($PARENT(..., 'drizzle', 'migrations'), ...), ...)
  # kiko-domain's "Dates": a local day is 23 or 25 hours on a DST change, and
  # a fixed offset from the REAL clock also crosses a second midnight when the
  # suite runs late at night (`Date.now() + DAY_MS + 1 h` after 23:00), so the
  # fixture lands on the wrong local day and the test fails only at some
  # hours. A fixed offset from a pinned constant is deterministic under the
  # jest.config.js zone pin and passes. `startOfLocalDay(Date.now() + DAY_MS)`
  # still fires: the sum itself can land two local days ahead. A span is
  # "day-sized" by its text: "day" as a whole camelCase/snake_case part, so
  # `startOfToday` and `holiday` are not spans; or 86_400_000, 24 * 60 * 60,
  # 60 * 60 * 24.
  # `$LEFT` is read by its text, so the clock may sit behind any number of
  # offsets (`Date.now() + HOUR + MINUTE + DAY_MS`) but must START the sum: a
  # clock nested inside a larger left side is a day COUNT
  # (`Math.floor((Date.now() - openedAt) / DAY_MS) - graceDays`), not a step.
  # `paths.include` is path-prefixed, so the fixture pair is NESTED.
  - id: kiko-no-fixed-day-offset-on-real-clock-in-test
    languages: [typescript]
    severity: ERROR
    message: >
      A test adds or subtracts a fixed day span to the real clock. A local day
      is 23 or 25 hours across DST, and a late-night run crosses a second
      midnight, so the fixture lands on the wrong local day at some hours.
      Step local calendar days, or pin the clock — see kiko-domain's "Dates".
    metadata:
      fix: "Step calendar days from local date fields (const date = new Date(time); date.setDate(date.getDate() + days)), or pin the clock with jest.setSystemTime / a fixed constant and offset from that."
      skill: "kiko-domain › Dates"
    paths:
      include:
        - "*.test.ts"
        - "*.test.tsx"
        - "src/test-support/**"
    patterns:
      - pattern-either:
          - pattern: Date.now() + $SPAN
          - pattern: Date.now() - $SPAN
          - pattern: $SPAN + Date.now()
          - pattern: new Date().getTime() + $SPAN
          - pattern: new Date().getTime() - $SPAN
          - pattern: $SPAN + new Date().getTime()
          - patterns:
              - pattern-either:
                  - pattern: $LEFT + $SPAN
                  - pattern: $LEFT - $SPAN
              - metavariable-regex:
                  metavariable: $LEFT
                  regex: ^(?:Date\.now\(\)|new Date\(\)\.getTime\(\))\s*[-+]
          - patterns:
              - pattern-either:
                  - pattern: $NOW + $SPAN
                  - pattern: $NOW - $SPAN
                  - pattern: $SPAN + $NOW
                  - pattern: $NOW += $SPAN
                  - pattern: $NOW -= $SPAN
                  - pattern: $NOW + $OFFSET + $SPAN
                  - pattern: $NOW - $OFFSET + $SPAN
                  - pattern: $NOW + $OFFSET - $SPAN
                  - pattern: $NOW - $OFFSET - $SPAN
              - pattern-either:
                  - pattern-inside: |
                      const $NOW = Date.now();
                      ...
                  - pattern-inside: |
                      let $NOW = Date.now();
                      ...
      - metavariable-regex:
          metavariable: $SPAN
          regex: ^.*(?:(?<![A-Za-z0-9])[Dd]ays?(?![a-z])|(?<=[a-z0-9])(?<!startOf|endOf|Local|Utc|last|first|next|previous)Days?(?![a-z])|(?<![A-Z])DAYS?(?![A-Z])|86_?400_?000|24\s*\*\s*60\s*\*\s*60|60\s*\*\s*60\s*\*\s*24)
      - pattern-not-inside: |
          jest.setSystemTime(...);
          ...
      - pattern-not-inside: |
          jest.useFakeTimers({..., now: $PINNED, ...});
          ...
  # kiko-design-system's "UX patterns" (Header bar items): UIKit sizes a native
  # bar item's glyph, glass capsule, and 44pt target; a React view in
  # `headerRight`/`headerLeft` or a `type: 'custom'` item gets a different glyph
  # size and capsule, so it does not read as the same kind of button as its
  # native neighbour. The `custom` arm is scoped to the header item lists, so
  # an unrelated `{ type: 'custom' }` object stays silent. Semgrep binds `$X`
  # in `{..., key: $X, ...}` to no arrow-function value, so each key also has
  # a `(...) => $V` arm, which matches an arrow with either body and a method.
  # Not a header view: `undefined` (it clears an item set earlier), a style
  # named for the slot inside `StyleSheet.create`, and a `const`/`let`
  # destructuring that reads the options back (Semgrep matches an object
  # pattern as an object literal).
  - id: kiko-header-item-native-only
    languages: [typescript]
    severity: ERROR
    message: >
      A header action is built as a React view (`headerRight`, `headerLeft`, or
      a `type: 'custom'` header item). UIKit sizes only a native bar item's
      glyph, capsule, and 44pt target, so a React view does not read as the
      same kind of button as its neighbour — see kiko-design-system's
      "UX patterns".
    metadata:
      fix: "Use a native `type: 'button'` item (`sfSymbol` icon, `sharesBackground: false`) in `unstable_headerRightItems`, or `editBarItem(...)`."
      skill: "kiko-design-system › UX patterns"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: "{..., headerRight: $X, ...}"
              - metavariable-regex:
                  metavariable: $X
                  regex: ^(?!undefined$)
          - pattern: "{..., headerRight: (...) => $V, ...}"
          - patterns:
              - pattern: "{..., headerLeft: $X, ...}"
              - metavariable-regex:
                  metavariable: $X
                  regex: ^(?!undefined$)
          - pattern: "{..., headerLeft: (...) => $V, ...}"
          - patterns:
              - pattern: "{..., type: 'custom', ...}"
              - pattern-either:
                  - pattern-inside: "{..., unstable_headerRightItems: $ITEMS, ...}"
                  - pattern-inside: "{..., unstable_headerRightItems: (...) => $ITEMS, ...}"
                  - pattern-inside: "{..., unstable_headerLeftItems: $ITEMS, ...}"
                  - pattern-inside: "{..., unstable_headerLeftItems: (...) => $ITEMS, ...}"
      - pattern-not-inside: StyleSheet.create(...)
      - pattern-not-inside: "const {..., headerRight: $R, ...} = $E;"
      - pattern-not-inside: "const {..., headerLeft: $R, ...} = $E;"
      - pattern-not-inside: "let {..., headerRight: $R, ...} = $E;"
      - pattern-not-inside: "let {..., headerLeft: $R, ...} = $E;"
  # kiko-design-system's "UX patterns" (Header bar items): native-stack sends a
  # `type: 'spacing'` item with no index, so react-native-screens inserts it at
  # the trailing edge rather than between the items it was meant to split. The
  # skill states the rule for any split, so both item lists are covered.
  - id: kiko-no-header-spacing-item
    languages: [typescript]
    severity: ERROR
    message: >
      A `type: 'spacing'` header item. native-stack sends it with no index, so
      react-native-screens inserts it at the trailing edge, not between the
      items it was meant to split — see kiko-design-system's "UX patterns".
    metadata:
      fix: "Split items with `sharesBackground: false`, never a spacing item."
      skill: "kiko-design-system › UX patterns"
    patterns:
      - pattern: "{..., type: 'spacing', ...}"
      - pattern-either:
          - pattern-inside: "{..., unstable_headerRightItems: $ITEMS, ...}"
          - pattern-inside: "{..., unstable_headerRightItems: (...) => $ITEMS, ...}"
          - pattern-inside: "{..., unstable_headerLeftItems: $ITEMS, ...}"
          - pattern-inside: "{..., unstable_headerLeftItems: (...) => $ITEMS, ...}"
  # kiko-architecture's "Reminders (local notifications)": the notification
  # status is one app-wide value that `useNotificationPermission().request`
  # publishes after the system prompt, and that counts a failed prompt as
  # denied. A direct `remindersNative.requestAuthorization` skips both, so a
  # mounted notice keeps the stale answer. `src/reminders/permission/**` is the
  # one owner; tests and `src/test-support/**` mock or spy on the member.
  - id: kiko-no-direct-notification-permission-request
    languages: [typescript]
    severity: ERROR
    message: >
      The notification prompt is called directly on `remindersNative`. Only
      `useNotificationPermission().request` publishes the answer to the shared
      status and counts a failed prompt as denied, so a direct call leaves every
      mounted notice on the stale answer — see kiko-architecture's
      "Reminders (local notifications)".
    metadata:
      fix: "Ask through `useNotificationPermission().request` (`@kiko/reminders/permission`)."
      skill: "kiko-architecture › Reminders (local notifications)"
    paths:
      exclude:
        - "src/reminders/permission/**"
        - "*.test.ts"
        - "*.test.tsx"
        - "__tests__/**"
        - "src/test-support/**"
    pattern: remindersNative.requestAuthorization
  # kiko-domain's "Dates": a local day is 23 or 25 hours across DST, so a fixed
  # day span added BEFORE taking the local day can land one calendar day off
  # (`startOfLocalDay(now - 30 * DAY_MS)` in the old default range). The
  # `metavariable-pattern` reaches nested sub-expressions on purpose: any day
  # span arithmetic inside the argument counts, so `time - 2 * DAY + HOUR`
  # fires. A span applied after the call returns (`startOfLocalDay(x) - DAY`)
  # is a different shape and is not in this rule. The `$SPAN` regex opens with
  # `.*` because `metavariable-regex` is start-anchored and `30 * DAY_MS`
  # starts with the count. Its names end in a day-span suffix (`dayMs`,
  # `ninetyDaysMs`, `ONE_DAY_MS`, `MILLISECONDS_PER_DAY`), never a bare `day`
  # part as in the real-clock rule: this rule reaches every sub-expression of
  # the argument, so `dayStart + HOUR` would fire there.
  - id: kiko-no-fixed-day-offset-into-local-day
    languages: [typescript]
    severity: ERROR
    message: >
      A fixed day span is added to the time passed to `startOfLocalDay` or
      `endOfLocalDay`. A local day is 23 or 25 hours across DST, so the sum can
      land one calendar day off — see kiko-domain's "Dates".
    metadata:
      fix: "Step local calendar fields (`new Date(y, m, d - N)`), then take `startOfLocalDay`; never add N * DAY_MS first."
      skill: "kiko-domain › Dates"
    paths:
      exclude:
        - "scripts/**"
        - "harness/**"
    patterns:
      - pattern-either:
          - pattern: startOfLocalDay($ARG)
          - pattern: endOfLocalDay($ARG)
      - metavariable-pattern:
          metavariable: $ARG
          patterns:
            - pattern-either:
                - pattern: $A + $SPAN
                - pattern: $A - $SPAN
                - pattern: $SPAN + $A
            - metavariable-regex:
                metavariable: $SPAN
                regex: .*(?:\bDAY(?:_MS)?\b|_DAYS?_MS\b|_PER_DAY\b|\bdayMs\b|(?<=[a-z0-9])Days?Ms\b|\bmsPerDay\b|86_?400_?000|24\s*\*\s*60\s*\*\s*60|60\s*\*\s*60\s*\*\s*24)
  # A local day length beside `DAY_MS` (`src/dates/duration.ts`, its one
  # owner) drifts. Matched by value, so every spelling of a day is one day.
  # Constant propagation is off, or every use of a local `DAY` would fire as
  # well as its declaration. A day literal held as the `t` or `day` value of an
  # object literal is a test fixture's timestamp of epoch + 1 day, not a span,
  # so arm 1 skips it. Arms and known limits: this rule's row in
  # docs/harness/review-to-biome-inventory.md; the `src/dates/**` exclude:
  # docs/harness/documented-exceptions.md.
  - id: kiko-no-local-day-length-constant
    languages: [typescript]
    severity: ERROR
    message: >
      A local day-length constant. The day in milliseconds has one source,
      `DAY_MS` in `@kiko/dates`; a near-duplicate copy drifts. Import `DAY_MS`
      and write N days as `N * DAY_MS` — see kiko-domain's "Dates".
    metadata:
      fix: "Import `DAY_MS` from `@kiko/dates` and use it (N days: `N * DAY_MS`) instead of a local `24 * 60 * 60 * 1000` / `86_400_000`."
      skill: "kiko-domain › Dates"
    paths:
      exclude:
        - "src/dates/**"
    options:
      constant_propagation: false
    pattern-either:
      - patterns:
          - pattern: "86400000"
          - pattern-not-inside: $A * $B
          - pattern-not-inside: "{..., t: 86400000, ...}"
          - pattern-not-inside: "{..., day: 86400000, ...}"
      - patterns:
          - pattern: $FACTOR * $LAST
          - metavariable-regex:
              metavariable: $FACTOR
              regex: ^[0-9][0-9_.eE\s*()]*$
          - metavariable-regex:
              metavariable: $LAST
              regex: ^[0-9][0-9_.eE]*$
          - metavariable-comparison:
              comparison: (($FACTOR * $LAST) % 86400000 == 0 and $FACTOR * $LAST > 0) or $FACTOR == 86400000 or $LAST == 86400000
      - patterns:
          - pattern-either:
              - pattern: $OTHER * $LITERAL
              - pattern: $LITERAL * $OTHER
          - metavariable-regex:
              metavariable: $LITERAL
              regex: ^[0-9][0-9_.eE]*$
          - metavariable-comparison:
              metavariable: $LITERAL
              comparison: $LITERAL == 86400000
          - metavariable-regex:
              metavariable: $OTHER
              regex: ^(?![0-9][0-9_.eE\s*()]*$)
  # `price_points` gains a row per share and metal per day and never shrinks,
  # so a read of the whole table costs more every month. Only a screen that
  # values the PAST needs every close (Statistics, through `usePriceBook`);
  # every other valuation reads `useCurrentPriceBook`. The four arms are the
  # ways to reach the whole table: the repo's `allQuery` (called or kept as a
  # reference), the hook that wraps it, a bare unfiltered select, and an
  # unfiltered relational read. The hook's own folder and the repo are
  # the owners and are excluded; the one legitimate consumer carries a
  # per-line `nosemgrep` override. Scope and known limits: this rule's row in
  # docs/harness/review-to-biome-inventory.md; the excludes:
  # docs/harness/documented-exceptions.md.
  - id: kiko-no-whole-price-points-read
    languages: [typescript]
    severity: ERROR
    message: >
      A read of the whole `price_points` table. It grows with every daily share
      and metal close, so a screen that values only now reads the current
      rows through `useCurrentPriceBook`; only a screen that values past days
      (Statistics) reads every close — see kiko-pricing's "Current price book
      and whole-table price book".
    metadata:
      fix: "Use `useCurrentPriceBook` (`@kiko/prices/use-current-price-book`); a history screen overrides the line with `// nosemgrep: kiko-no-whole-price-points-read OVERRIDE(<why it values past days>)`."
      skill: "kiko-pricing › Current price book and whole-table price book"
    paths:
      exclude:
        - "src/prices/use-price-book/**"
        - "src/prices/price-points-repo/**"
        - "*.test.ts"
        - "*.test.tsx"
    pattern-either:
      - pattern: pricePointsRepo.allQuery
      - pattern: usePriceBook(...)
      - patterns:
          - pattern: $DATABASE.select(...).from(pricePoints)
          - pattern-not-inside: $QUERY.where(...)
          - pattern-not-inside: $QUERY.limit(...)
      - patterns:
          - pattern: $DATABASE.query.pricePoints.$METHOD(...)
          - pattern-not: "$DATABASE.query.pricePoints.$METHOD({where: ..., ...})"
          - pattern-not: "$DATABASE.query.pricePoints.$METHOD({limit: ..., ...})"
  # kiko-domain's "A holding is deleted only after its cascade". The bare name
  # matches where it is used as an expression (a call); an import line and a
  # comment never match. The two repo files are the owners: one defines the
  # helper, the other runs it right after the cascade. Scope and known limits:
  # this rule's row in docs/harness/review-to-biome-inventory.md; the excludes:
  # docs/harness/documented-exceptions.md.
  - id: kiko-holding-delete-needs-cascade
    languages: [typescript]
    severity: ERROR
    message: >
      `removeHoldingDatabaseTransaction` deletes the holding and its own rows
      only. Without the cascade that runs first, the other legs of an Exchange,
      Convert or split stay behind and their money exists on one side only, so
      the delete creates money. Delete through `transactionsRepo.removeHolding`
      (or `accountsRepo.remove` for an account) — see kiko-domain's "A holding
      is deleted only after its cascade".
    metadata:
      fix: "Call `transactionsRepo.removeHolding(holdingId)`, which runs the cascade and then the holding delete in one transaction."
      skill: "kiko-domain › A holding is deleted only after its cascade"
    paths:
      exclude:
        - "src/transactions/repo/transactions.repo.ts"
        - "src/holdings/repo/holdings.repo.ts"
        - "*.test.ts"
        - "*.test.tsx"
    pattern: removeHoldingDatabaseTransaction
  # kiko-code-style's "A jest.requireActual call takes no type argument". A regex,
  # not an AST pattern: Semgrep reads an absent type argument as matching `<$T>`, so
  # `jest.requireActual('m') as T` would match too. The `<` right after the callee is
  # the whole signal, and the regex reads across a line break. No `paths.include`:
  # any file that calls jest.requireActual is test code (a test, a __mocks__ file, a
  # test-support helper), and a typed call in a helper cuts the chain test -> helper
  # -> real module as well. Known limits: this rule's section in kiko-linter.
  - id: kiko-no-typed-jest-require-actual
    languages: [typescript]
    severity: ERROR
    message: >
      `jest.requireActual<T>(...)`, `jest.requireMock<T>(...)`, `jest.createMockFromModule<T>(...)`
      and `jest.genMockFromModule<T>(...)` hide the module from jest-haste-map's dependency
      extractor, which reads only `jest.<name>(` followed by a string literal. `jest
      --findRelatedTests` (and Stryker's per-test coverage) then never relates the test to that
      module. Drop the type argument and type the result instead:
      `jest.requireActual('m') as { ... }`, or a typed const annotation — see kiko-code-style's
      "A jest.requireActual call takes no type argument".
    metadata:
      fix: "jest.requireActual('module') as { ... }  (or `const actual: Shape = jest.requireActual('module')`), no `<T>` on the call; the same for requireMock, createMockFromModule and genMockFromModule."
      skill: "kiko-code-style › A jest.requireActual call takes no type argument"
    pattern-regex: '\bjest\s*(?:\?\.|\.)\s*(?:require(?:Actual|Mock)|createMockFromModule|genMockFromModule)\s*<'
